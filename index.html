/* ---- 解压 docx 里的某个文件 ---- */
async function unzipEntry(buf, target) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);

  // 找 EOCD（目录结束标记）
  let eocd = -1;
  for (let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("不是有效的 .docx 文件");

  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const decoder = new TextDecoder("utf-8");

  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method    = dv.getUint16(p + 10, true);
    const compSize  = dv.getUint32(p + 20, true);
    const nameLen   = dv.getUint16(p + 28, true);
    const extraLen  = dv.getUint16(p + 30, true);
    const cmtLen    = dv.getUint16(p + 32, true);
    const localOff  = dv.getUint32(p + 42, true);
    const name      = decoder.decode(u8.subarray(p + 46, p + 46 + nameLen));

    if (name === target) {
      const lNameLen  = dv.getUint16(localOff + 26, true);
      const lExtraLen = dv.getUint16(localOff + 28, true);
      const start = localOff + 30 + lNameLen + lExtraLen;
      const data = u8.subarray(start, start + compSize);

      if (method === 0) return decoder.decode(data);
      if (method === 8) {
        const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        return await new Response(stream).text();
      }
      throw new Error("不支持的压缩格式");
    }
    p += 46 + nameLen + extraLen + cmtLen;
  }
  throw new Error("文档里找不到正文内容");
}

/* ---- 解析 Word 表格 → 排班数据 ---- */
function parseScheduleXml(xmlText, year) {
  const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("Word 内容解析失败");

  const tables = doc.getElementsByTagNameNS(W, "tbl");
  if (!tables.length) throw new Error("文档里没有表格");

  const norm = s => (s || "").replace(/[\s\u3000]/g, "");
  const roleMap = { "带班领导": "leader", "支撑干部": "support", "生产厂长": "factory", "值班课长": "kuzhang" };

  let dates = [];      // 当前这一组：列号 → 日期key
  let dateCount = 0, peopleCount = 0;

  for (let ti = 0; ti < tables.length; ti++) {
    const trs = tables[ti].getElementsByTagNameNS(W, "tr");
    for (let ri = 0; ri < trs.length; ri++) {
      const tcs = trs[ri].getElementsByTagNameNS(W, "tc");
      const cells = [];
      for (let ci = 0; ci < tcs.length; ci++) cells.push(norm(cellText(tcs[ci], W)));
      if (!cells.length) continue;

      // 日期行
      if (cells[0] === "日期") {
        dates = [];
        for (let ci = 1; ci < cells.length; ci++) {
          const m = cells[ci].match(/(\d{1,2})月(\d{1,2})日/);
          if (m) {
            dates[ci] = year + "-" + pad(+m[1]) + "-" + pad(+m[2]);
            dateCount++;
          }
        }
        continue;
      }

      // 角色行
      let roleKey = null;
      for (const cn in roleMap) {
        if (cells[0].indexOf(cn) >= 0) { roleKey = roleMap[cn]; break; }
      }
      if (!roleKey || !dates.length) continue;

      for (let ci = 1; ci < cells.length; ci++) {
        const dk = dates[ci];
        const name = cells[ci];
        if (!dk || !name) continue;
        if (!schedule[dk]) schedule[dk] = {};
        schedule[dk][roleKey] = name;
        peopleCount++;
      }
    }
  }

  const phoneCount = extractPhones(doc, W);
  return { dates: dateCount, people: peopleCount, phones: phoneCount };
}

function cellText(tc, W) {
  const ts = tc.getElementsByTagNameNS(W, "t");
  let s = "";
  for (let i = 0; i < ts.length; i++) s += ts[i].textContent;
  return s;
}

/* ---- 从文档里提取「姓名 + 手机号」 ---- */
function extractPhones(doc, W) {
  const ts = doc.getElementsByTagNameNS(W, "t");
  let all = "";
  for (let i = 0; i < ts.length; i++) all += ts[i].textContent;

  const re = /([\u4e00-\u9fa5]{2,7})\s*(1[3-9]\d{9})/g;
  let m, n = 0;
  while ((m = re.exec(all)) !== null) {
    const before = all.charAt(m.index - 1);
    // 名字前面不能还是汉字，避免把「值班领导」这种前缀吞进来
    if (before && /[\u4e00-\u9fa5]/.test(before)) continue;
    const name = m[1], phone = m[2];
    if (PHONES[name] !== phone) {
      PHONES[name] = phone;
      n++;
    }
  }
  return n;
}

/* =====================================================
   工具
   ===================================================== */
const weekdayCN = ["周日","周一","周二","周三","周四","周五","周六"];
function pad(n) { return String(n).padStart(2,"0"); }
function key(d) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function todayKey() { return key(new Date()); }

/* =====================================================
   Tab 切换
   ===================================================== */
function switchTab(name) {
  document.getElementById("tab-gen").classList.toggle("active", name === "gen");
  document.getElementById("tab-edit").classList.toggle("active", name === "edit");
  document.getElementById("panel-gen").style.display = name === "gen" ? "block" : "none";
  document.getElementById("panel-edit").style.display = name === "edit" ? "block" : "none";
  if (name === "edit") renderTable();
}

/* =====================================================
   ② 编辑排班表 - 渲染可编辑表格
   ===================================================== */
function renderTable() {
  const root = document.getElementById("scheduleTable");
  const dates = Object.keys(schedule).sort();
  const roles = [
    { k: "leader",  n: "带班领导", cls: "leader-col" },
    { k: "support", n: "支撑干部" },
    { k: "factory", n: "生产厂长" },
    { k: "kuzhang", n: "值班课长" }
  ];

  // 表头：日期 | 带班领导 | 支撑干部 | 生产厂长 | 值班课长
  let html = '<div class="table-scroll"><table class="schedule"><thead><tr>';
  html += '<th class="date-col">日期</th>';
  roles.forEach(r => {
    html += '<th class="' + (r.cls || "") + '">' + r.n + '</th>';
  });
  html += '</tr></thead><tbody>';

  // 每行一个日期
  dates.forEach(k => {
    const d = new Date(k + "T00:00:00");
    const isToday = k === todayKey();
    const wk = d.getDay();
    const isWeekend = wk === 0 || wk === 6;

    html += '<tr' + (isToday ? ' class="today-row"' : '') + '>';
    html += '<td class="date-col">'
          + '<span class="d">' + (d.getMonth() + 1) + '/' + d.getDate() + '</span>'
          + '<span class="w' + (isWeekend ? ' weekend' : '') + '">' + weekdayCN[wk] + '</span>'
          + '</td>';

    roles.forEach(r => {
      const val = (schedule[k] && schedule[k][r.k]) || "";
      html += '<td class="' + (r.cls || "") + '">'
            + '<input type="text" value="' + escapeAttr(val) + '" title="' + escapeAttr(val) + '" data-col="' + k + '" data-row="' + r.k + '" placeholder="—">'
            + '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  root.innerHTML = html;

  // 绑定输入事件：实时同步到 schedule 对象
  root.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", function() {
      const col = this.dataset.col, row = this.dataset.row;
      if (!schedule[col]) schedule[col] = {};
      schedule[col][row] = this.value.trim();
    });
  });
}

function escapeAttr(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* =====================================================
   ① 生成通知文字
   ===================================================== */
function buildText(date) {
  const k = key(date);
  const data = schedule[k];
  const dateStr = date.getFullYear() + "年" + (date.getMonth()+1) + "月" + date.getDate() + "日(" + weekdayCN[date.getDay()] + ")";

  let t = "福建天甫电子材料有限公司\n";
  t += "公司全员遇有紧急情况，必须在第一时间向值班领导汇报。\n\n";
  t += "日期：" + dateStr + "\n\n";

  if (!data) {
    t += "（排班表中暂无该日期的值班安排）";
    return t;
  }

  const roleList = [
    { k: "leader",  n: "带班领导" },
    { k: "support", n: "支撑干部" },
    { k: "factory", n: "生产厂长" },
    { k: "kuzhang", n: "值班课长" }
  ];

  roleList.forEach((r, i) => {
    const name = (data[r.k] || "").trim();
    const phone = PHONES[name] || "";
    if (name) {
      t += r.n + "：" + name + "\n";
      t += "电话：" + phone + "\n";
      if (i < roleList.length - 1) t += "\n";
    } else {
      t += r.n + "：（暂无排班）\n\n";
    }
  });

  return t.trim() + "\n";
}

function renderGen() {
  const d = currentDate();
  document.getElementById("datePicker").value = key(d);
  document.getElementById("output").value = buildText(d);
}

let _currentDate = null;
function currentDate() {
  if (_currentDate) return _currentDate;
  return new Date();
}
function setCurrentDate(d) { _currentDate = d; renderGen(); }

function goToday() { _currentDate = null; renderGen(); }
function shiftDay(delta) {
  const d = new Date(currentDate());
  d.setDate(d.getDate() + delta);
  _currentDate = d;
  renderGen();
}

document.getElementById("datePicker").addEventListener("change", function(e) {
  _currentDate = new Date(e.target.value + "T00:00:00");
  renderGen();
});

/* =====================================================
   复制
   ===================================================== */
function copyText() {
  const ta = document.getElementById("output");
  ta.select();
  ta.setSelectionRange(0, 99999);
  const ok = document.execCommand("copy");
  if (ok) { showToast("已复制 ✓ 去群里粘贴吧"); return; }
  navigator.clipboard.writeText(ta.value).then(
    () => showToast("已复制 ✓ 去群里粘贴吧"),
    () => showToast("复制失败，请手动选择", true)
  );
}

function showToast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (isErr ? " error" : "") + " show";
  setTimeout(() => t.className = "toast" + (isErr ? " error" : ""), 2200);
}

/* =====================================================
   启动
   ===================================================== */
loadPhones();
renderGen();
</script>
