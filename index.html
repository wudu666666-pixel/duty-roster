/* ====================== 状态 ====================== */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

let schedule = (function(){
  try { const s = lsGet("tianfu_schedule"); if (s) return JSON.parse(s); } catch(e){}

/* 查找某日期所在那一周的厂务部值班 */
function findPlantOn(dateKey) {
  const sorted = plant.slice().sort((a,b) => (a.start||"").localeCompare(b.start||""));
  for (const row of sorted) {
    if (row.start && row.end && dateKey >= row.start && dateKey <= row.end) return row;
  }
  return null;
}

/* ====================== 工具 ====================== */
const weekdayCN = ["周日","周一","周二","周三","周四","周五","周六"];
function pad(n) { return String(n).padStart(2,"0"); }
function key(d) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function todayKey() { return key(new Date()); }
function escapeAttr(s) { return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function showToast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (isErr ? " error" : "") + " show";
  setTimeout(() => t.className = "toast" + (isErr ? " error" : ""), 2200);
}

/* ====================== Tab 切换 ====================== */
function switchTab(name) {
  for (const n of ["gen","edit","plant"]) {
    document.getElementById("tab-" + n).classList.toggle("active", name === n);
    document.getElementById("panel-" + n).style.display = name === n ? "block" : "none";
  }
  if (name === "edit") renderTable();
  if (name === "plant") renderPlant();
}

/* ====================== 干部排班：渲染 & 保存 ====================== */
function renderTable() {
  const root = document.getElementById("scheduleTable");
  const dates = Object.keys(schedule).sort();
  const roles = [
    { k: "leader",  n: "带班领导", cls: "leader-col" },
    { k: "support", n: "支撑干部" },
    { k: "factory", n: "生产厂长" },
    { k: "kuzhang", n: "值班课长" }
  ];

  let html = '<div class="table-scroll"><table class="schedule"><thead><tr>';
  html += '<th class="date-col">日期</th>';
  roles.forEach(r => html += '<th class="' + (r.cls||"") + '">' + r.n + '</th>');
  html += '</tr></thead><tbody>';

  dates.forEach(k => {
    const d = new Date(k + "T00:00:00");
    const isToday = k === todayKey();
    const wk = d.getDay();
    const isWeekend = wk === 0 || wk === 6;

    html += '<tr' + (isToday ? ' class="today-row"' : '') + '>';
    html += '<td class="date-col">'
          + '<span class="d">' + (d.getMonth()+1) + '/' + d.getDate() + '</span>'
          + '<span class="w' + (isWeekend ? ' weekend' : '') + '">' + weekdayCN[wk] + '</span>'
          + '</td>';
    roles.forEach(r => {
      const val = (schedule[k] && schedule[k][r.k]) || "";
      html += '<td class="' + (r.cls||"") + '">'
            + '<input type="text" value="' + escapeAttr(val) + '" data-col="' + k + '" data-row="' + r.k + '">'
            + '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  root.innerHTML = html;

  root.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", function() {
      const col = this.dataset.col, row = this.dataset.row;
      if (!schedule[col]) schedule[col] = {};
      schedule[col][row] = this.value.trim();
    });
  });
}

function saveSchedule() {
  const ok = lsSet("tianfu_schedule", JSON.stringify(schedule));
  showToast(ok ? "干部排班已保存 ✓" : "已修改（浏览器禁用本地保存）", !ok);
  renderTable();
  renderGen();
}
function resetSchedule() {
  if (!confirm("确定恢复为原始干部排班数据？未保存的修改会丢失。")) return;
  schedule = JSON.parse(JSON.stringify(ORIGINAL));
  saveSchedule();
}

          + '</td>';
    html += '<td class="name-col"><input type="text" value="' + escapeAttr(row.name) + '" data-idx="' + idx + '" data-f="name" placeholder="姓名"></td>';
    html += '<td class="phone-col"><input type="text" value="' + escapeAttr(row.phone) + '" data-idx="' + idx + '" data-f="phone" placeholder="电话"></td>';
    html += '<td class="op-col"><button class="btn-danger btn-sm" onclick="removePlantRow(' + idx + ')">🗑</button></td>';
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  root.innerHTML = html;

  root.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", function() {
      const idx = +this.dataset.idx, f = this.dataset.f;
      if (!plant[idx]) plant[idx] = { start: "", end: "", name: "", phone: "" };
      plant[idx][f] = this.value.trim();
    });
  });
}

function savePlant() {
  // 校验日期
  let bad = false;
  for (const r of plant) {
    if (!r.start || !r.end) { bad = true; break; }
    if (r.start > r.end) { bad = true; break; }
  }
  if (bad) { showToast("日期有问题，请检查起止日期", true); return; }

  const ok = lsSet("tianfu_plant", JSON.stringify(plant));
  showToast(ok ? "厂务部排班已保存 ✓" : "已修改（浏览器禁用本地保存）", !ok);
  renderPlant();
  renderGen();
}
function resetPlant() {
  if (!confirm("确定恢复为原始厂务部排班数据？")) return;
  plant = JSON.parse(JSON.stringify(ORIGINAL_PLANT));
  savePlant();
}
function addPlantRow() {
  // 自动生成下一周：从最后一行的 end +1 天开始
  let start, end;
  if (plant.length > 0) {
    const last = plant[plant.length - 1];
    const sd = new Date(last.start + "T00:00:00");
    const ed = new Date(last.end + "T00:00:00");
    ed.setDate(ed.getDate() + 1);
    sd.setDate(sd.getDate() + 7);
    start = key(ed);
    const endDate = new Date(ed);
    endDate.setDate(endDate.getDate() + 6);
    end = key(endDate);
  } else {
    const d = new Date();
    start = key(d);
    const d2 = new Date(d);
    d2.setDate(d2.getDate() + 6);
    end = key(d2);
  }
  plant.push({ start, end, name: "", phone: "" });
  renderPlant();
}
function removePlantRow(idx) {
  if (!confirm("确定删除这一周的排班？")) return;
  plant.splice(idx, 1);
  renderPlant();
}

/* ====================== 通知文字生成 ====================== */
function buildText(date) {
  const k = key(date);
  const data = schedule[k];
  const dateStr = date.getFullYear() + "年" + (date.getMonth()+1) + "月" + date.getDate() + "日(" + weekdayCN[date.getDay()] + ")";

  let t = "福建天甫电子材料有限公司\n";
  t += "公司全员遇有紧急情况，必须在第一时间向值班领导汇报。\n\n";
  t += "日期：" + dateStr + "\n\n";

  if (!data) {
    t += "（排班表中暂无该日期的值班安排）";
  } else {
    const roleList = [
      { k: "leader",  n: "带班领导" },
      { k: "support", n: "支撑干部" },
      { k: "factory", n: "生产厂长" },
      { k: "kuzhang", n: "值班课长" }
    ];
    roleList.forEach((r, i) => {
      const name = (data[r.k] || "").trim();
      const phone = PHONES[name] || "";
      if (name) {
        t += r.n + "：" + name + "\n";
        t += "电话：" + phone + "\n";
        if (i < roleList.length - 1) t += "\n";
      } else {
        t += r.n + "：（暂无排班）\n\n";
      }
    });
  }

  // 追加厂务部值班
  const pl = findPlantOn(k);
  t += "\n";
  if (pl && pl.name) {
    t += "厂务部值班：" + pl.name + "\n";
    if (pl.phone) t += "电话：" + pl.phone + "\n";
  } else {
    t += "厂务部值班：（暂无排班）\n";
  }

  return t.trim() + "\n";
}

function renderGen() {
  const d = currentDate();
  document.getElementById("datePicker").value = key(d);
  document.getElementById("output").value = buildText(d);
}

let _currentDate = null;
function currentDate() { return _currentDate ? _currentDate : new Date(); }
function goToday() { _currentDate = null; renderGen(); }
function shiftDay(delta) {
  const d = new Date(currentDate());
  d.setDate(d.getDate() + delta);
  _currentDate = d;
  renderGen();
}

document.getElementById("datePicker").addEventListener("change", function(e) {
  _currentDate = new Date(e.target.value + "T00:00:00");
  renderGen();
});

/* ====================== 复制 ====================== */
function copyText() {
  const ta = document.getElementById("output");
  ta.select();
  ta.setSelectionRange(0, 99999);
  const ok = document.execCommand("copy");
  if (ok) { showToast("已复制 ✓ 去群里粘贴吧"); return; }
  navigator.clipboard.writeText(ta.value).then(
    () => showToast("已复制 ✓ 去群里粘贴吧"),
    () => showToast("复制失败，请手动选择", true)
  );
}

/* ====================== Word 导入（复用原有逻辑） ====================== */
async function importDocx(e) {
  const f = e.target.files[0];
  if (!f) return;
  e.target.value = "";

  const year = parseInt(document.getElementById("importYear").value, 10) || new Date().getFullYear();
  setImportMsg("正在读取「" + f.name + "」…", "#6b7385");

  try {
    const buf = await f.arrayBuffer();
    const xml = await unzipEntry(buf, "word/document.xml");
    const res = parseScheduleXml(xml, year);
    if (res.dates === 0) throw new Error("没找到日期行");

    lsSet("tianfu_schedule", JSON.stringify(schedule));
    lsSet("tianfu_phones", JSON.stringify(PHONES));

    renderTable();
    renderGen();

    setImportMsg(
      "导入成功 ✓ 共识别 <b>" + res.dates + "</b> 个日期、" + res.people + " 条值班、" + res.phones + " 个电话",
      "#16a34a"
    );
    showToast("Word 排班表导入成功 ✓");
  } catch (err) {
    setImportMsg("导入失败：" + err.message, "#dc2626");
    showToast("导入失败", true);
  }
}
function setImportMsg(html, color) {
  const el = document.getElementById("importMsg");
  if (!el) return;
  el.innerHTML = html;
  el.style.color = color || "#6b7385";
}

async function unzipEntry(buf, target) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("不是有效的 .docx 文件");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const decoder = new TextDecoder("utf-8");
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method    = dv.getUint16(p + 10, true);
    const compSize  = dv.getUint32(p + 20, true);
    const nameLen   = dv.getUint16(p + 28, true);
    const extraLen  = dv.getUint16(p + 30, true);
    const cmtLen    = dv.getUint16(p + 32, true);
    const localOff  = dv.getUint32(p + 42, true);
    const name      = decoder.decode(u8.subarray(p + 46, p + 46 + nameLen));
    if (name === target) {
      const lNameLen  = dv.getUint16(localOff + 26, true);
      const lExtraLen = dv.getUint16(localOff + 28, true);
      const start = localOff + 30 + lNameLen + lExtraLen;
      const data = u8.subarray(start, start + compSize);
      if (method === 0) return decoder.decode(data);
      if (method === 8) {
        const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        return await new Response(stream).text();
      }
      throw new Error("不支持的压缩格式");
    }
    p += 46 + nameLen + extraLen + cmtLen;
  }
  throw new Error("文档里找不到正文内容");
}

function parseScheduleXml(xmlText, year) {
  const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("Word 内容解析失败");
  const tables = doc.getElementsByTagNameNS(W, "tbl");
  if (!tables.length) throw new Error("文档里没有表格");
  const norm = s => (s || "").replace(/[\s\u3000]/g, "");
  const roleMap = { "带班领导": "leader", "支撑干部": "support", "生产厂长": "factory", "值班课长": "kuzhang" };
  let dates = [], dateCount = 0, peopleCount = 0;
  for (let ti = 0; ti < tables.length; ti++) {
    const trs = tables[ti].getElementsByTagNameNS(W, "tr");
    for (let ri = 0; ri < trs.length; ri++) {
      const tcs = trs[ri].getElementsByTagNameNS(W, "tc");
      const cells = [];
      for (let ci = 0; ci < tcs.length; ci++) {
        const ts = tcs[ci].getElementsByTagNameNS(W, "t");
        let s = ""; for (let i = 0; i < ts.length; i++) s += ts[i].textContent;
        cells.push(norm(s));
      }
      if (!cells.length) continue;
      if (cells[0] === "日期") {
        dates = [];
        for (let ci = 1; ci < cells.length; ci++) {
          const m = cells[ci].match(/(\d{1,2})月(\d{1,2})日/);
          if (m) {
            dates[ci] = year + "-" + pad(+m[1]) + "-" + pad(+m[2]);
            dateCount++;
          }
        }
        continue;
      }
      let roleKey = null;
      for (const cn in roleMap) {
        if (cells[0].indexOf(cn) >= 0) { roleKey = roleMap[cn]; break; }
      }
      if (!roleKey || !dates.length) continue;
      for (let ci = 1; ci < cells.length; ci++) {
        const dk = dates[ci];
        const name = cells[ci];
        if (!dk || !name) continue;
        if (!schedule[dk]) schedule[dk] = {};
        schedule[dk][roleKey] = name;
        peopleCount++;
      }
    }
  }
  // 提取电话
  const ts = doc.getElementsByTagNameNS(W, "t");
  let all = "";
  for (let i = 0; i < ts.length; i++) all += ts[i].textContent;
  const re = /([\u4e00-\u9fa5]{2,7})\s*(1[3-9]\d{9})/g;
  let m, phoneCount = 0;
  while ((m = re.exec(all)) !== null) {
    const before = all.charAt(m.index - 1);
    if (before && /[\u4e00-\u9fa5]/.test(before)) continue;
    if (PHONES[m[1]] !== m[2]) { PHONES[m[1]] = m[2]; phoneCount++; }
  }
  return { dates: dateCount, people: peopleCount, phones: phoneCount };
}
